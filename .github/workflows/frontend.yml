name: Angular CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "angular-10-social-login/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "angular-10-social-login/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular-10-social-login

    env:
      # Angular 10 uses webpack 4, which needs the legacy OpenSSL provider on Node >= 17
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: angular-10-social-login/package-lock.json
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Build (production)
      run: npx ng build --prod
    - name: Unit tests (Chrome Headless)
      run: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage
    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: angular-dist
        path: angular-10-social-login/dist/
        retention-days: 7
