# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Backend: Spring Boot (Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # Spring Boot parent + Spring managed artifacts in a single PR
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      jjwt:
        patterns:
          - "io.jsonwebtoken*"
      # Everything else: bundle minor/patch bumps together
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend: Angular (npm)
  - package-ecosystem: "npm"
    directory: "/angular-10-social-login"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      angular:
        patterns:
          - "@angular*"
          - "@angular-devkit*"
          - "zone.js"
          - "rxjs"
          - "tslib"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Angular major upgrades need `ng update` migrations, handle them manually
      - dependency-name: "@angular*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@angular-devkit*"
        update-types: [ "version-update:semver-major" ]
      # 0.x packages: a "minor" bump is a breaking/major one
      # (build-angular 0.1002.x = Angular 10, 0.1102.x = Angular 11; zone.js must stay ~0.10 for Angular 10)
      - dependency-name: "@angular-devkit/build-angular"
        update-types: [ "version-update:semver-minor" ]
      - dependency-name: "zone.js"
        update-types: [ "version-update:semver-minor" ]
      # Tooling pinned to what Angular 10 supports
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "rxjs"
        update-types: [ "version-update:semver-major" ]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
